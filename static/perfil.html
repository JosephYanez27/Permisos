<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Principal1_1</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body data-modulo="principal1_1">

<!-- 🔹 LAYOUT GLOBAL -->
<div id="layout"></div>

<!-- 🔹 BREADCRUMB -->
<div class="breadcrumb">
    <a href="menu.html">Index</a> > Principal 1 > <span>Principal1_1</span>
</div>

<h2>Principal 1_1</h2>

<div class="container">

    <div class="card">

        <p class="descripcion">
            Vista estática con integración de permisos del sistema.
        </p>

        <!-- 🔹 BOTÓN AGREGAR -->
        <button class="btn" data-permiso="agregar" onclick="abrirModal()">
            Nuevo Registro
        </button>

        <table class="tabla-usuarios">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Editar</th>
                    <th>Eliminar</th>
                </tr>
            </thead>

            <tbody id="tabla-principal">

                <tr>
                    <td>1</td>
                    <td>Registro 1</td>
                    <td>Ejemplo estático</td>
                    <td class="activo">Activo</td>

                    <td>
                        <button data-permiso="editar">
                            Editar
                        </button>
                    </td>

                    <td>
                        <button data-permiso="eliminar">
                            Eliminar
                        </button>
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Registro 2</td>
                    <td>Otro ejemplo</td>
                    <td class="inactivo">Inactivo</td>

                    <td>
                        <button data-permiso="editar">
                            Editar
                        </button>
                    </td>

                    <td>
                        <button data-permiso="eliminar">
                            Eliminar
                        </button>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- 🔹 MODAL -->
<div id="modal" class="modal">
    <div class="modal-content usuario-form">

        <span class="close" onclick="cerrarModal()">&times;</span>

        <h2>Nuevo Registro</h2>

        <div class="form-group">
            <label>Nombre</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Descripción</label>
            <input type="text">
        </div>

        <div class="form-actions">
            <button class="btn-guardar">Guardar</button>
            <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>

    </div>
</div>

<!-- 🔹 JS GLOBAL -->
<script src="js/config.js"></script>
<script src="js/fetchAuth.js"></script>
<script src="js/menu.js"></script>
<script src="js/authPermisos.js"></script>

<script>

/* 🔹 MODAL */
function abrirModal(){
    document.getElementById("modal").style.display = "block";
}

function cerrarModal(){
    document.getElementById("modal").style.display = "none";
}

/* 🔥 INIT */
document.addEventListener("DOMContentLoaded", async () => {

    // 🔹 Cargar menú/layout
    await cargarLayout();

    // 🔐 Validar acceso al módulo
    const acceso = await aplicarPermisosAuto();
    if (!acceso) return;

    // 🔐 Aplicar permisos a botones
    aplicarPermisosEnVista();
});
</script>

</body>
</html>
