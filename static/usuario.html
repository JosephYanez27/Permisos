<!DOCTYPE html>
<html>
<head>
    <title>Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-modulo="usuario">
    <div id="layout"></div>

<div class="breadcrumb">
    <a href="menu.html">Index</a> > Seguridad > <a href="usuario.html">Usuario</a>
</div>

<h2>Usuario</h2>

<div class="filtros-usuario">

    <div>
        <label>Usuario:</label>
        <input type="text" id="filtro-usuario">
    </div>

    <div>
        <label>Perfil:</label>
        <select id="filtro-perfil"></select>
    </div>

    <div>
        <label>Estado:</label>
        <select id="filtro-estado">
            <option value="">Todos</option>
            <option value="1">Activo</option>
            <option value="2">Inactivo</option>
        </select>
    </div>

    <div class="acciones-filtro">
        <button onclick="buscarUsuarios()">Buscar</button>
        <button onclick="limpiarFiltros()">Limpiar</button>
    </div>

</div>

<div class="btn-agregar">
<button onclick="abrirModal()" data-permiso="agregar">
  Nuevo Usuario
</button>

</div>

<h3>[Resultados]</h3>

<table class="tabla-usuarios">
    <thead>
        <tr>
            <th>Usuario</th>
            <th>Perfil</th>
            <th>Estado</th>
            <th>Correo</th>
            <th>Celular</th>
            <th>Editar</th>
            <th>Eliminar</th>
        </tr>
    </thead>
    <tbody id="tabla-usuarios">
        <!-- Se llena dinámicamente -->
    </tbody>
</table>



<div class="paginacion" id="paginacion"></div>
<div id="modalUsuario" class="modal">
<div class="modal-content usuario-form">

    <span onclick="cerrarModal()" class="close">&times;</span>

    <h2>Usuario</h2>

    <div class="form-group">
        <label>Nombre</label>
        <input id="usuario" maxlength="30" autocomplete="off">
    </div>

    <div class="form-group">
        <label>Correo</label>
        <input id="correo" type="email" maxlength="50">
    </div>

    <div class="form-group">
        <label>Celular</label>
        <input id="celular" maxlength="15">
    </div>

    <div class="form-group">
        <label>Perfil</label>
        <select id="perfil"></select>
    </div>

    <div class="form-group">
        <label>Estado</label>
        <select id="estado">
            <option value="1">Activo</option>
            <option value="2">Inactivo</option>
        </select>
    </div>

    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" maxlength="50">
    </div>

    <div class="form-actions">
        <button class="btn-guardar" onclick="guardarUsuario()">Guardar</button>
        <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
    </div>

</div>
</div>

<script src="js/config.js"></script>
<script src="js/fetchAuth.js"></script>
<script src="js/menu.js"></script>
<script src="js/authPermisos.js"></script>
<script src="js/usuario.js"></script>


<script>
document.addEventListener("DOMContentLoaded",async () => {
    await cargarLayout();
 await aplicarPermisosAuto();


});
</script>

</body>
</html>
