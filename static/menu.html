<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- 🔹 TOPBAR -->
<header class="topbar">
    <div class="left">
        <h2>Mi Sistema</h2>
    </div>

    <div class="right">
        <span id="saludo"></span>
        <button onclick="logout()">Salir</button>
    </div>
</header>

<!-- 🔹 MENU HORIZONTAL -->
<nav class="menu-horizontal">
    <ul id="menu-list"></ul>
</nav>

<script src="js/config.js"></script>
<script src="js/fetchAuth.js"></script>
<script src="js/menu.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    await aplicarPermisosAuto(); // 🔥 permisos
    await cargarMenu();          // 🔥 menú
    mostrarUsuario();            // 🔥 saludo

});

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    localStorage.removeItem("permisos");
    window.location.href = "login.html";
}
</script>

</body>
</html>
