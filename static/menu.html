<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- 🔹 TOPBAR -->
<header class="topbar">

    <div class="left">
        <h2>Mi Sistema</h2>

        <nav class="menu-horizontal">
            <ul id="menu-list"></ul>
        </nav>
    </div>

    <div class="right">

        <!-- 🔥 PERFIL -->
        <div class="perfil" onclick="irPerfil()">
            <img id="foto-user" src="https://via.placeholder.com/40">
            <span id="saludo"></span>
        </div>

        <button onclick="logout()">Salir</button>
    </div>

</header>

<script src="js/config.js"></script>
<script src="js/fetchAuth.js"></script>
<script src="js/menu.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    await aplicarPermisosAuto(); // 🔥 permisos
    await cargarMenu();          // 🔥 menú
    mostrarUsuario();            // 🔥 saludo

});

function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    localStorage.removeItem("permisos");
    window.location.href = "login.html";
}
</script>

</body>
</html>
